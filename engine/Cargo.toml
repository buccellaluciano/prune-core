[package]
name = "prune-engine"
description = "Motor de P-Rune Core: catálogo, tweaks, historial y acceso a Windows. Sin interfaz."
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
windows = { workspace = true, features = ["Win32_UI_Shell", "Management_Deployment", "ApplicationModel", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_NetworkManagement_NetManagement", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_System_Registry", "Win32_Networking_WinHttp", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Media_Audio", "Win32_System_SystemInformation", "Security_Credentials_UI", "Win32_System_WinRT", "Win32_Security_Credentials", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_Dns", "Win32_Networking_WinSock", "Win32_Networking_WinInet", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Wmi", "Win32_System_Restore", "Win32_UI_Shell_Common", "Win32_System_Environment", "Win32_Graphics_Gdi"] }
winreg = "0.56.0"
toml = "1.2.0"
thiserror = "2.0.21"
windows-future = "0.3.2"
# Solo para descomprimir la release de WMO (ya venía con el plugin de actualizaciones).
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
